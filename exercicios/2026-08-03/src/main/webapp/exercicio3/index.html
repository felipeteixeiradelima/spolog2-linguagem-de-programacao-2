<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Aula 2 - Exercício 3</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <h1>Quiz de Esportes</h1>
            <h2>Aula 2 - Exercício 3</h2>
            <hr />
        </header>

        <main>
            <form action="IndexHandlerServlet" method="post">
                <fieldset>
                    <legend>Selecione o nível de dificuldade</legend>
                    <div>
                        <input
                            type="radio"
                            name="dificuldade"
                            id="facil"
                            value="facil"
                            required
                        />
                        <label for="facil">Fácil</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            name="dificuldade"
                            id="dificil"
                            value="dificil"
                        />
                        <label for="dificil">Difícil</label>
                    </div>
                </fieldset>
                <button type="submit">Iniciar Quiz</button>
            </form>
        </main>
    </body>
</html>
